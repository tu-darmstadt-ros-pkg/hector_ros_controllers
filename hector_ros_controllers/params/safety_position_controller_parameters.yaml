safety_position_controller:
  joints:
    type: string_array
    default_value: []
    description: Names of the joints to control. Must match the joints defined in the robot URDF.
    read_only: true

  check_self_collisions:
    type: bool
    default_value: true
    description: If true, the controller checks for potential self-collisions at the target pose before applying position commands.
    read_only: true

  collision_padding:
    type: double
    default_value: 0.01
    description: Minimum allowed distance in [m] between any two links to consider the robot safe from self-collisions when 'check_self_collisions' is true.
    validation:
      bounds<>: [0.0, 1.0]

  collision_cache_epsilon:
    type: double
    default_value: 0.000001
    description: Epsilon in [rad] used to speed up self-collision checks by caching previous distance computations when 'check_self_collisions' is true.

  use_broadphase:
    type: bool
    default_value: true
    description: >
      If true, uses AABB-tree broadphase acceleration for self-collision distance queries.
      This prunes far-apart geometry pairs before running narrow-phase GJK, typically
      yielding a 3-5x speedup. Only relevant when 'check_self_collisions' is true.
    read_only: true

  collision_safety_zone:
    type: double
    default_value: 0.05
    description: >
      Outer safety zone distance in [m]. When the minimum collision distance falls between
      'collision_padding' and 'collision_safety_zone', joint velocities are linearly scaled
      down to zero. Must be strictly greater than 'collision_padding'.

  acceleration_limits:
    __map_joints:
      limit:
        type: double
        default_value: 8.0
        description: >
          Per-joint acceleration limit (speed-up) in rad/s^2 (m/s^2 for prismatic).
        validation:
          bounds<>: [0.001, 10000.0]

  deceleration_scale:
    type: double
    default_value: 3.0
    description: >
      Deceleration limit = deceleration_scale * acceleration limit. Braking (for safety)
      is allowed to be stronger than speed-up so collision stops stay snappy while
      re-acceleration is smooth.
    validation:
      bounds<>: [1.0, 100.0]

  qp_damper_xi:
    type: double
    default_value: 2.0
    description: >
      Collision velocity-damper gain in [1/s]: the allowed approach speed toward a
      collision is qp_damper_xi * (distance - collision_padding) /
      (collision_safety_zone - collision_padding).
    validation:
      bounds<>: [0.01, 100.0]

  qp_max_pair_constraints:
    type: int
    default_value: 10
    description: >
      Maximum number of collision pairs used as QP constraints per cycle (the closest
      pairs are kept). Bounds the QP size for real-time safety.
    validation:
      bounds<>: [1, 64]

  qp_max_repulsion_speed:
    type: double
    default_value: 0.05
    description: >
      Cap in [m/s] on the active push-out speed the collision damper may request when a
      pair is inside the collision padding.
    validation:
      bounds<>: [0.0, 10.0]

  joint_deviation_limits:
    __map_joints:
      limit:
        type: double
        default_value: 0.25
        description: >
          Maximum allowed deviation in [rad] of the commanded joint position from the
          (leashed) reference while flowing around collisions. Bounds how far EVERY link
          may leave the upstream-validated path (per-joint box, one-sided: it never
          demands catch-up, only prevents drifting further). 0 disables for that joint.
        validation:
          bounds<>: [0.0, 100.0]

  qp_contact_crawl_speed:
    type: double
    default_value: 0.15
    description: >
      Velocity clamp in [rad/s] applied while any collision pair is inside the padding.
      Tangential sliding on curved geometry sinks the true distance quadratically with
      speed (linearization sag), so crawling near contact keeps the capped push-out
      stronger than the sag. 0 disables.
    validation:
      bounds<>: [0.0, 100.0]

  reference_leash_time:
    type: double
    default_value: 0.3
    description: >
      Bounds how far the reference may run ahead of the commanded position:
      per cycle the tracked target is clamped to within velocity_limit *
      reference_leash_time of the current command. This bounds the catch-up motion after
      a blockage resolves regardless of upstream behavior. 0 disables.
    validation:
      bounds<>: [0.0, 60.0]

  tracking_leash:
    type: double
    default_value: 0.5
    description: >
      Anti-windup bound in [rad] on |commanded - measured| position per joint. If the
      hardware cannot follow (e.g. compliant mode), the command is clamped near the
      measured position instead of running ahead and storing energy. 0 disables.
    validation:
      bounds<>: [0.0, 10.0]

  qp_stall_timeout:
    type: double
    default_value: 1.0
    description: >
      Time in [s] after which 'stalled' is reported when the reference demands motion
      but the QP output is (near) zero — e.g. blocked head-on by a collision constraint
      so no flow-around direction exists. Upstream planners should treat this as a
      request to replan.
    validation:
      bounds<>: [0.05, 600.0]

  stall_park_timeout:
    type: double
    default_value: 5.0
    description: >
      If the commanded motion has been stalled for this long [s], the controller PARKS:
      the current reference is considered abandoned and the limb holds position even if
      the blocking obstacle later moves away (no unexpected delayed motion). Tracking
      resumes only when the reference changes by more than
      park_resume_reference_threshold on any joint, i.e. on a new command. Should be
      larger than qp_stall_timeout. 0 disables parking.
    validation:
      bounds<>: [0.0, 3600.0]

  park_resume_reference_threshold:
    type: double
    default_value: 0.01
    description: >
      Per-joint reference change in [rad] relative to the reference latched at park time
      that counts as a new command and releases the parked state.
    validation:
      bounds<>: [0.0001, 10.0]

  qp_stall_velocity_threshold:
    type: double
    default_value: 0.01
    description: >
      Velocity threshold in [rad/s] below which the commanded motion counts as stalled
      (while the desired velocity is above it).
    validation:
      bounds<>: [0.0001, 10.0]

  default_velocity_limit:
    type: double
    default_value: 1.5
    description: >
      Fallback velocity limit in [rad/s] (or [m/s] for prismatic joints) for joints whose
      URDF does not specify a velocity limit. Without this, such joints would be stepped
      without any per-cycle bound and could jump to a far-away target in one cycle.
    validation:
      bounds<>: [0.001, 100.0]

  debug_visualize_collisions:
    type: bool
    default_value: false
    description: If true, the controller publishes visualization markers for potential self-collisions to help with debugging.

  publish_collision_distances:
    type: bool
    default_value: false
    description: >
      If true, publishes lightweight visualization markers showing only the distance
      lines for collision pairs within the safety zone. Much cheaper than
      'debug_visualize_collisions' as it skips geometry markers and safe-pair lines.
      Uses a realtime publisher for non-blocking operation. Ignored if
      'debug_visualize_collisions' is true.

  publish_qp_debug:
    type: bool
    default_value: false
    description: >
      If true, publishes per-cycle QP introspection on ~/qp_debug (per-joint desired vs
      commanded velocity and bounds, per-constraint distance/required/achieved approach
      speed, solver state). For PlotJuggler/debugging; dynamically reconfigurable.

  publish_debug_joint_states:
    type: bool
    default_value: false
    description: If true, the controller publishes the received target command states and the computed states as separate joint state msgs

  set_current_limits:
    type: bool
    default_value: false
    description: If true, the controller additionally sets current limits see compliant and stiff limits
    read_only: true

  current_limits:
    __map_joints:
      compliant_limit:
        type: double
        description: Current limits for each joint in the group in Ampere. 'set_current_limits' must be true.
        default_value: 3.0
      stiff_limit:
        type: double
        default_value: 5.0
        description: Default current limit for each joint in the group in Ampere. Will be set if current interface requested but compliant mode is off.

  manipulability_ee_frame:
    type: string
    default_value: arm_end_link
    description: >
      Name of the URDF frame used for manipulability index computation
      (Yoshikawa w = sqrt(det(J*J^T))). Set to empty string to disable.

  status_publish_rate:
    type: double
    default_value: 10.0
    description: >
      Rate in Hz at which the safety controller status (including collision distance
      and manipulability) is published. Set to 0 to only publish on events.
    validation:
      bounds<>: [0.0, 100.0]

  safety_bypass_timeout:
    type: double
    default_value: 60.0
    description: Time in seconds after which safety checks are automatically re-enabled when bypassed via service. Must be positive.
    validation:
      bounds<>: [0.1, 600.0]

  safety_bypass_joint_limit_tolerance:
    type: double
    default_value: 0.03
    description: Tolerance factor (0.0-1.0) added to joint limits when safety bypass is active. E.g., 0.03 means 3% tolerance beyond normal limits.
    validation:
      bounds<>: [0.0, 1.0]
