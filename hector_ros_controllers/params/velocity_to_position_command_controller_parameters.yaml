velocity_to_position_command_controller:
  joints: {type: string_array, default_value: [], description: Name of the joints to control}

  synchronous_groups: {type: string_array, default_value: [], description: Specifies}

  passthrough_controller: {type: string, default_value: '', description: Name of passthrough controller which exposes command interfaces for the specified joints}

  e_stop_topic: {type: string, default_value: estop_board/hard_estop, description: 'Topic to subscribe to for emergency stop messages. If set, the controller will stop all commands when an emergency stop message is received.'}

  kp: {type: double, default_value: 1.0, description: Proportional gain for the velocity to position pd-controller}
  kd: {type: double, default_value: 0.1, description: Differential gain for for the velocity to position pd-controller}
  kp_sync: {type: double, default_value: 1.0, description: Proportional gain for the synchronization of synced joints}
  kd_sync: {type: double, default_value: 0.0, description: Derivative gain for synchronization using velocity difference between partners to damp oscillation}
  sync_velocity_factor: {type: double, default_value: 1.0, description: 'Factor applied to abs(vel_command) to clamp the sync correction velocity during MOVING. The sync correction is added on top of the commanded velocity, so with factor 1.0 a joint can reach up to 2x vel_command (one joint speeds up, the other slows down — both contribute). Lower values produce gentler, slower resyncing. Values > 1.0 allow even more aggressive correction.'}
  max_sync_velocity: {type: double, default_value: 0.0, description: 'Absolute upper limit (rad/s) for sync correction velocity. 0 means no absolute limit (only the factor-based clamp applies). When > 0, the effective clamp is min(sync_velocity_factor * abs(vel_command), max_sync_velocity).'}

  stopping_velocity_threshold: {type: double, default_value: 0.005, description: Velocity threshold below which a joint is considered stopped}

  braking_deceleration: {type: double, default_value: 5.0, description: Deceleration in rad/s^2 used to smoothly bring joints to a stop when velocity command becomes zero. Higher values mean faster braking.}

  publish_debug_joint_states: {type: bool, default_value: false, description: 'If true, publishes ~/debug_in_joint_states (velocity references) and ~/debug_out_joint_states (position commands) as sensor_msgs/JointState'}
