velocity_to_position_command_controller:
  joints: {type: string_array, default_value: [], description: Name of the joints to control}

  synchronous_groups: {type: string_array, default_value: [], description: Specifies}

  passthrough_controller: {type: string, default_value: '', description: Name of passthrough controller which exposes command interfaces for the specified joints}

  e_stop_topic: {type: string, default_value: estop_board/hard_estop, description: 'Topic to subscribe to for emergency stop messages. If set, the controller will stop all commands when an emergency stop message is received.'}

  kp: {type: double, default_value: 1.0, description: Proportional gain for the velocity to position pd-controller}
  kd: {type: double, default_value: 0.1, description: Differential gain for for the velocity to position pd-controller}
  kp_sync: {type: double, default_value: 1.0, description: Proportional gain for the synchronization of synced joints}
  kd_sync: {type: double, default_value: 0.1, description: Differential gain for the synchronization of synced joints}
  sync_velocity_factor: {type: double, default_value: 1, description: Maximum sync velocity correction as a factor of commanded velocity}
  sync_velocity_min_threshold: {type: double, default_value: 0.1, description: Minimum absolute sync velocity correction (rad/s) applied regardless of commanded velocity. Ensures sync works at low speeds and at rest.}

  stopping_velocity_threshold: {type: double, default_value: 0.005, description: Velocity threshold below which a joint is considered stopped}

  max_velocity: {type: double, default_value: 1.0, description: Maximum velocity in rad/s. Clamps incoming velocity references and limits velocity during action profiles.}
  max_acceleration: {type: double, default_value: 2.0, description: Maximum acceleration in rad/s^2. Used for drive actions and sync actions.}
  max_deceleration: {type: double, default_value: 4.0, description: Maximum deceleration in rad/s^2. Used for braking profiles when velocity commands go to zero. Higher than max_acceleration for faster stopping.}

  publish_debug_joint_states: {type: bool, default_value: false, description: 'If true, publishes ~/debug_in_joint_states (velocity references) and ~/debug_out_joint_states (position commands) as sensor_msgs/JointState'}

  velocity_command_timeout: {type: double, default_value: 0.0, description: 'Timeout in seconds. If no new non-zero velocity command arrives within this duration, velocity references are zeroed. 0 disables the timeout.'}

  upright_position: {type: double, default_value: 1.517, description: Default target position for the upright action in radians}
